<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" role="img" aria-label="Clément Sampebgo — curious about data, building useful software"><title>Clément Sampebgo — curious about data, building useful software</title><style>
.weave{animation:drift 8s ease-in-out infinite}
.trace{stroke-dasharray:12 88;animation:trace 10s linear infinite}
.trace-secondary{animation-duration:14s;animation-direction:reverse}
.pulse{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.signal{stroke-dasharray:9 91;animation:trace 14s linear infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){.weave,.trace,.pulse,.signal{animation:none}.trace{opacity:.35}.signal{opacity:.2}}
</style><rect width="640" height="370" rx="18" fill="#111827"/><path d="M32 336H608" stroke="#60a5fa" opacity=".4"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="53" fill="#60a5fa" font-size="19" font-weight="700" letter-spacing="3">DATA · AI · SOFTWARE</text><text x="30" y="135" fill="#f9fafb" font-size="58" font-weight="700">Clément</text><text x="30" y="200" fill="#f9fafb" font-size="58" font-weight="700">Sampebgo</text><text x="34" y="263" fill="#c0c9d6" font-size="25">Curious about data.</text><text x="34" y="299" fill="#60a5fa" font-size="25">Building useful software.</text></g><g transform="translate(383 63) scale(.8)"><g class="weave" fill="none" stroke-linecap="round" stroke-width="4"><path d="M30 110 110 30 190 110 110 190Z" stroke="#60a5fa"/><path d="m70 110 80-80 80 80-80 80Z" stroke="#2563eb"/><path d="m30 150 80-80 80 80-80 80Z" stroke="#60a5fa" opacity=".45"/><path d="m70 150 80-80 80 80-80 80Z" stroke="#2563eb" opacity=".45"/><path d="M110 30v200M30 110h200" stroke="#374151" stroke-width="1"/><path class="trace" pathLength="100" d="M30 110 110 30 190 110 110 190Z" stroke="#bfdbfe" stroke-width="4.5"/><path class="trace trace-secondary" pathLength="100" d="m70 110 80-80 80 80-80 80Z" stroke="#60a5fa" stroke-width="4.5"/><circle class="pulse" cx="110" cy="110" r="6" fill="#60a5fa" stroke="#111827"/></g></g><path class="signal" pathLength="100" d="M32 336H608" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".65"/></svg>