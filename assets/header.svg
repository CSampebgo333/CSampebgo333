<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Clément Sampebgo — data, AI and software"><title>Clément Sampebgo — data, AI and software</title><style>
.weave{animation:drift 8s ease-in-out infinite}
.trace{stroke-dasharray:12 88;animation:trace 10s linear infinite}
.trace-secondary{animation-duration:14s;animation-direction:reverse}
.pulse{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
.signal{stroke-dasharray:9 91;animation:trace 14s linear infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes trace{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
@media(prefers-reduced-motion:reduce){.weave,.trace,.pulse,.signal{animation:none}.trace{opacity:.35}.signal{opacity:.2}}
</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#013832"/><stop offset="1" stop-color="#013832"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c5ddd5" opacity=".1"/></pattern></defs><rect width="1200" height="340" rx="18" fill="url(#bg)"/><rect x="805" width="395" height="340" fill="url(#dots)"/><path d="M0 322H1200" stroke="#7cdec2" stroke-width="2" opacity=".35"/><g font-family="Arial, Helvetica, sans-serif"><text x="54" y="65" fill="#7cdec2" font-size="17" font-weight="700" letter-spacing="4">DATA · AI · SOFTWARE</text><text x="50" y="151" fill="#f9fafb" font-size="69" font-weight="700" letter-spacing="-2">Clément Sampebgo</text><text x="54" y="207" fill="#c5ddd5" font-size="27">Curious about data. Building useful software.</text><text x="54" y="276" fill="#7cdec2" font-size="20">Computer Science · Ashesi University ’27</text></g><g transform="translate(891 52)"><g class="weave" fill="none" stroke-linecap="round" stroke-width="4"><path d="M30 110 110 30 190 110 110 190Z" stroke="#7cdec2"/><path d="m70 110 80-80 80 80-80 80Z" stroke="#16866b"/><path d="m30 150 80-80 80 80-80 80Z" stroke="#7cdec2" opacity=".45"/><path d="m70 150 80-80 80 80-80 80Z" stroke="#16866b" opacity=".45"/><path d="M110 30v200M30 110h200" stroke="#2c6459" stroke-width="1"/><path class="trace" pathLength="100" d="M30 110 110 30 190 110 110 190Z" stroke="#d3f7ec" stroke-width="4.5"/><path class="trace trace-secondary" pathLength="100" d="m70 110 80-80 80 80-80 80Z" stroke="#7cdec2" stroke-width="4.5"/><circle class="pulse" cx="110" cy="110" r="6" fill="#7cdec2" stroke="#013832"/></g></g><path class="signal" pathLength="100" d="M18 322H1182" fill="none" stroke="#7cdec2" stroke-width="2" opacity=".65"/></svg>